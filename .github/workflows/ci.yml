name: CI

# revetsec-soklet CI (plan §10.1, §10.3). Revetsec core is not on Maven Central yet, so every job that
# needs it checks out revetsec/revetsec at the pinned commit in REVETSEC_CORE_SHA, installs it into the
# runner's local Maven repository with -DskipTests -Dmaven.javadoc.skip=true. Soklet 4 is also built
# from the pinned upstream commit with a checksum-pinned Corretto 21.0.11 and its JAR checksum verified before use.
# Both source pins move only by pull request.
#
# Every action is pinned to a full commit SHA; the trailing comment is the tag it was resolved from with
# `git ls-remote`. Dependabot's github-actions entry keeps the pins current.

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
  workflow_dispatch:

env:
  # ==================================================================================================
  # PINNED REVETSEC CORE COMMIT: the full 40-character SHA of a pushed revetsec/revetsec commit.
  #
  # This pushed commit contains the resource-validator, authorization-server, password, TOTP,
  # recovery-code, and WebAuthn APIs used by the adapter and its examples.
  # ==================================================================================================
  REVETSEC_CORE_SHA: '59d59383b51c697d3b2d13e726d6f8df7d81a2d4'
  # Soklet 4.0.0 is not published yet. This pushed commit includes default HEAD handling.
  SOKLET_SHA: '61d02245c745cedf8452a1fc0a13be96f9414a9b'
  SOKLET_JAR_SHA256: '56e37d0e8ef781822de1618595f43366df00bb29e7b486cdc5901623b83845a9'

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash gives `-eo pipefail` on every run step.
    shell: bash

jobs:
  # Gating. The drift check (plan §10.1): the files copied from core must equal the pinned core's.
  drift:
    name: Core Pin and Drift Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out revetsec-soklet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adapter
          persist-credentials: false

      - name: Validate the core pin
        run: |
          if [[ "$REVETSEC_CORE_SHA" =~ ^0{40}$ ]]; then
            echo "::error title=Revetsec core pin not set::REVETSEC_CORE_SHA in .github/workflows/ci.yml is still the 40-zero placeholder. Replace it with the full SHA of a pushed revetsec/revetsec commit (the first core commit or a later one)."
            exit 1
          fi
          if [[ ! "$REVETSEC_CORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid Revetsec core pin::REVETSEC_CORE_SHA must be a full 40-character lowercase commit SHA, not a branch, tag or abbreviated SHA."
            exit 1
          fi
          echo "Building against revetsec/revetsec@${REVETSEC_CORE_SHA}"

      # Full history: every branch of revetsec/revetsec is fetched, so the next step can see which ones
      # contain the pin. The pinned commit is still what is checked out.
      - name: Check out Revetsec core at the pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: revetsec/revetsec
          ref: ${{ env.REVETSEC_CORE_SHA }}
          path: core
          fetch-depth: 0
          persist-credentials: false

      # GitHub serves any commit of the fork network through revetsec/revetsec, so a checkout by SHA
      # also succeeds for a commit that exists only in someone's fork. The pin must be reachable from a
      # revetsec/revetsec branch. On a pull request only, the head commit of an open core pull request
      # is also accepted, with a warning, for lockstep changes (plan §10.1): before the adapter pull
      # request merges, move the pin to the merged core commit, or merge the core pull request with a
      # merge commit so that this SHA lands on main. Push and manual runs accept branch commits only.
      - name: Require the core pin on a revetsec/revetsec branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branches=$(git -C core branch --remotes --contains "$REVETSEC_CORE_SHA" | sed -e 's/^[* ]*//' | paste -sd ' ' -)
          if [[ -n "$branches" ]]; then
            echo "Core pin ${REVETSEC_CORE_SHA} is on revetsec/revetsec: ${branches}"
            exit 0
          fi
          also=""
          if [[ "$EVENT_NAME" == pull_request ]]; then
            # A failed API call fails the step: the check never passes on missing information.
            open_pulls=$(gh api --paginate 'repos/revetsec/revetsec/pulls?state=open&per_page=100' \
              --jq ".[] | select(.head.sha == \"${REVETSEC_CORE_SHA}\") | .number")
            if [[ -n "$open_pulls" ]]; then
              open_pull=${open_pulls%%$'\n'*}
              echo "::warning title=Core pin is an open core pull request::REVETSEC_CORE_SHA is the head of open revetsec/revetsec pull request #${open_pull} and is not on any revetsec/revetsec branch yet. Before this pull request merges, move the pin to the merged core commit (or merge #${open_pull} with a merge commit)."
              exit 0
            fi
            also=" and is not the head of an open revetsec/revetsec pull request"
          fi
          echo "::error title=Core pin not on a revetsec/revetsec branch::${REVETSEC_CORE_SHA} is not reachable from any branch of revetsec/revetsec${also}. Pin a commit that was pushed to revetsec/revetsec."
          exit 1

      - name: Test the drift check
        run: python3 -m unittest discover -s adapter/scripts -p 'test_*.py' -v

      - name: Check for drift from core
        run: >-
          python3 adapter/scripts/verify-core-drift.py
          --expected-commit "$REVETSEC_CORE_SHA"
          --core-directory core
          --adapter-directory adapter

  # Gating. Contract and helper tests run inside verify; the separate Javadoc job uses its pinned compiler.
  test:
    name: Test (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Do not cancel the other JDKs when one fails; every JDK's result is useful.
      fail-fast: false
      matrix:
        jdk: ['21', '25', '27']
    steps:
      - name: Check out revetsec-soklet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adapter
          persist-credentials: false

      - name: Validate the core pin
        run: |
          if [[ "$REVETSEC_CORE_SHA" =~ ^0{40}$ ]]; then
            echo "::error title=Revetsec core pin not set::REVETSEC_CORE_SHA in .github/workflows/ci.yml is still the 40-zero placeholder. Replace it with the full SHA of a pushed revetsec/revetsec commit (the first core commit or a later one)."
            exit 1
          fi
          if [[ ! "$REVETSEC_CORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid Revetsec core pin::REVETSEC_CORE_SHA must be a full 40-character lowercase commit SHA, not a branch, tag or abbreviated SHA."
            exit 1
          fi

      - name: Check out Revetsec core at the pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: revetsec/revetsec
          ref: ${{ env.REVETSEC_CORE_SHA }}
          path: core
          persist-credentials: false

      - name: Download checksum-pinned Corretto 21.0.11 for the framework build
        run: >-
          bash adapter/.github/scripts/download-pinned-corretto21-linux-x64.sh
          "$RUNNER_TEMP/amazon-corretto-21.0.11.10.1-linux-x64.tar.gz"

      - name: Set up Corretto 21.0.11 for the framework build
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: jdkfile
          java-version: '21.0.11'
          jdk-file: ${{ runner.temp }}/amazon-corretto-21.0.11.10.1-linux-x64.tar.gz
          cache: maven

      - name: Check out Soklet at the framework pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: soklet/soklet
          ref: ${{ env.SOKLET_SHA }}
          path: soklet
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the Soklet source pin
        run: >-
          python3 adapter/scripts/verify-soklet-baseline.py
          --soklet-directory soklet --expected-commit "$SOKLET_SHA"
          --expected-jar-sha256 "$SOKLET_JAR_SHA256"

      - name: Remove cached Soklet artifacts
        run: rm -rf ~/.m2/repository/com/soklet

      - name: Build and install checksum-pinned Soklet
        run: |
          mvn -B -ntp -f soklet/pom.xml -DskipTests -Dmaven.javadoc.skip=true clean install
          python3 adapter/scripts/verify-soklet-baseline.py \
            --soklet-directory soklet --expected-commit "$SOKLET_SHA" \
            --expected-jar-sha256 "$SOKLET_JAR_SHA256" --jar soklet/target/soklet-4.0.0.jar

      # The Maven cache may hold an earlier core; build only against the pinned one.
      - name: Remove cached Revetsec artifacts
        run: rm -rf ~/.m2/repository/com/revetsec

      - name: Install Revetsec core at the pin
        run: mvn -B -ntp -f core/pom.xml -DskipTests -Dmaven.javadoc.skip=true install

      - name: Set up Corretto ${{ matrix.jdk }} for adapter tests
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: ${{ matrix.jdk }}

      - name: Verify
        run: mvn -B -ntp -f adapter/pom.xml -Dmaven.javadoc.skip=true verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-jdk-${{ matrix.jdk }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: adapter/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 14

  # Gating. Error Prone + NullAway and SpotBugs + FindSecBugs use JDK 21, matching the release target.
  static-analysis:
    name: Static Analysis (JDK 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out revetsec-soklet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adapter
          persist-credentials: false

      - name: Validate the core pin
        run: |
          if [[ "$REVETSEC_CORE_SHA" =~ ^0{40}$ ]]; then
            echo "::error title=Revetsec core pin not set::REVETSEC_CORE_SHA in .github/workflows/ci.yml is still the 40-zero placeholder. Replace it with the full SHA of a pushed revetsec/revetsec commit (the first core commit or a later one)."
            exit 1
          fi
          if [[ ! "$REVETSEC_CORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid Revetsec core pin::REVETSEC_CORE_SHA must be a full 40-character lowercase commit SHA, not a branch, tag or abbreviated SHA."
            exit 1
          fi

      - name: Check out Revetsec core at the pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: revetsec/revetsec
          ref: ${{ env.REVETSEC_CORE_SHA }}
          path: core
          persist-credentials: false

      - name: Download checksum-pinned Corretto 21.0.11
        run: >-
          bash adapter/.github/scripts/download-pinned-corretto21-linux-x64.sh
          "$RUNNER_TEMP/amazon-corretto-21.0.11.10.1-linux-x64.tar.gz"

      - name: Set up Corretto 21.0.11
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: jdkfile
          java-version: '21.0.11'
          jdk-file: ${{ runner.temp }}/amazon-corretto-21.0.11.10.1-linux-x64.tar.gz
          cache: maven

      - name: Check out Soklet at the framework pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: soklet/soklet
          ref: ${{ env.SOKLET_SHA }}
          path: soklet
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the Soklet source pin
        run: >-
          python3 adapter/scripts/verify-soklet-baseline.py
          --soklet-directory soklet --expected-commit "$SOKLET_SHA"
          --expected-jar-sha256 "$SOKLET_JAR_SHA256"

      - name: Remove cached Soklet artifacts
        run: rm -rf ~/.m2/repository/com/soklet

      - name: Build and install checksum-pinned Soklet
        run: |
          mvn -B -ntp -f soklet/pom.xml -DskipTests -Dmaven.javadoc.skip=true clean install
          python3 adapter/scripts/verify-soklet-baseline.py \
            --soklet-directory soklet --expected-commit "$SOKLET_SHA" \
            --expected-jar-sha256 "$SOKLET_JAR_SHA256" --jar soklet/target/soklet-4.0.0.jar

      - name: Remove cached Revetsec artifacts
        run: rm -rf ~/.m2/repository/com/revetsec

      - name: Install Revetsec core at the pin
        run: mvn -B -ntp -f core/pom.xml -DskipTests -Dmaven.javadoc.skip=true install

      - name: Error Prone, NullAway, SpotBugs and FindSecBugs
        run: mvn -B -ntp -f adapter/pom.xml -Dmaven.javadoc.skip=true -Pstatic-analysis,spotbugs verify

  javadoc:
    name: Javadoc (Corretto 26)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out revetsec-soklet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adapter
          persist-credentials: false

      - name: Validate the core pin
        run: |
          if [[ "$REVETSEC_CORE_SHA" =~ ^0{40}$ ]]; then
            echo "::error::Revetsec core pin is unset."
            exit 1
          fi
          if [[ ! "$REVETSEC_CORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Revetsec core pin must be a full lowercase SHA."
            exit 1
          fi

      - name: Check out Revetsec core at the pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: revetsec/revetsec
          ref: ${{ env.REVETSEC_CORE_SHA }}
          path: core
          persist-credentials: false

      - name: Download checksum-pinned Corretto 21.0.11 for Maven
        run: >-
          bash adapter/.github/scripts/download-pinned-corretto21-linux-x64.sh
          "$RUNNER_TEMP/amazon-corretto-21.0.11.10.1-linux-x64.tar.gz"

      - name: Set up Corretto 21.0.11 for Maven
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: jdkfile
          java-version: '21.0.11'
          jdk-file: ${{ runner.temp }}/amazon-corretto-21.0.11.10.1-linux-x64.tar.gz
          cache: maven

      - name: Install checksum-pinned Corretto 26 for Javadoc
        run: >-
          bash adapter/.github/scripts/install-pinned-corretto-linux-x64.sh
          javadocJava "$RUNNER_TEMP" "$GITHUB_ENV"
          "$RUNNER_TEMP/adapter-javadoc-java-distribution.txt"

      - name: Check out Soklet at the framework pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: soklet/soklet
          ref: ${{ env.SOKLET_SHA }}
          path: soklet
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the Soklet source pin
        run: >-
          python3 adapter/scripts/verify-soklet-baseline.py
          --soklet-directory soklet --expected-commit "$SOKLET_SHA"
          --expected-jar-sha256 "$SOKLET_JAR_SHA256"

      - name: Remove cached Soklet artifacts
        run: rm -rf ~/.m2/repository/com/soklet

      - name: Build and install checksum-pinned Soklet
        run: |
          mvn -B -ntp -f soklet/pom.xml -DskipTests -Dmaven.javadoc.skip=true clean install
          python3 adapter/scripts/verify-soklet-baseline.py \
            --soklet-directory soklet --expected-commit "$SOKLET_SHA" \
            --expected-jar-sha256 "$SOKLET_JAR_SHA256" --jar soklet/target/soklet-4.0.0.jar

      - name: Remove cached Revetsec artifacts
        run: rm -rf ~/.m2/repository/com/revetsec

      - name: Build and install pinned core with its documentation index
        run: >-
          mvn -B -ntp -f core/pom.xml -DskipTests
          -Dmaven.javadoc.failOnWarnings=true clean install

      - name: Build warnings-fatal adapter Javadoc
        run: >-
          mvn -B -ntp -f adapter/pom.xml -DskipTests
          -Dmaven.javadoc.failOnWarnings=true
          -Drevetsec.core.javadoc.location="$GITHUB_WORKSPACE/core/target/reports/apidocs"
          clean verify
