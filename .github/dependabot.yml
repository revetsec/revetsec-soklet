version: 2
updates:
  # revetsec-soklet has no runtime dependencies of its own: Revetsec core and Soklet are provided, and the
  # rest is build and test tooling. Every entry waits 7 days after a release before proposing it
  # (cooldown), so a compromised or yanked release is less likely to reach a PR.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Group compatible tooling releases; framework baselines and major upgrades stay separate.
    groups:
      build-and-test-tooling:
        patterns: ["*"]
        exclude-patterns: ["com.revetsec:*", "com.soklet:*"]
        update-types: ["minor", "patch"]
    ignore:
      # Core is built from the commit pinned in .github/workflows/ci.yml (REVETSEC_CORE_SHA), not
      # resolved from a repository, and scripts/verify-core-drift.py ties revetsec.version to it.
      - dependency-name: "com.revetsec:revetsec"
    # com.soklet:soklet is deliberately not ignored: 4.0.0 is the owner-approved baseline.
    # Review later framework updates by hand.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Keep major action migrations as individual reviews.
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
